<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A study timer where every focused minute is one step of making a momo.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -40 80 72'%3E%3Cpath d='M-30,10 Q-34,-12 0,-30 Q34,-12 30,10 Q0,24 -30,10Z' fill='%23e3402b' stroke='%231c2a86' stroke-width='3'/%3E%3Ccircle cy='-29' r='4' fill='%23e3402b' stroke='%231c2a86' stroke-width='2.4'/%3E%3C/svg%3E">
<title>Momodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a gridded food-poster sheet. Blue rules split it into cells:
   information | illustration (the timer circle, momo made inside it)
   minute      |
   (blank red field)
   then today's plate and the week below. White ground, red / yellow / blue ink. */
:root{
  --white:#ffffff;
  --ink:#1c2a86;        /* ultramarine ink, used for text and rules */
  --ink-soft:#5563a8;
  --blue:#2b44c4;
  --blue-wash:#e8ecfb;
  --red:#e3402b;        /* tomato */
  --red-wash:#fde3dc;
  --yellow:#eab52b;     /* mustard tape */
  --yellow-wash:#fbf0cc;
  --serif:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rule:1.5px;
  color-scheme:light;
}
*{box-sizing:border-box}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
html,body{background:var(--white)}
body{color:var(--ink);font-family:var(--sans);font-size:clamp(15px,1.1vw + 10px,18px);line-height:1.5}
.page{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:clamp(16px,2.5vw,28px)}

/* masthead */
.mast{display:grid;grid-template-columns:1fr;align-items:end;gap:12px 24px;border-bottom:var(--rule) solid var(--ink);padding-bottom:clamp(8px,1.5vw,16px)}
.mast h1{margin:0;font-family:var(--mono);font-weight:800;color:var(--red);font-size:clamp(2.5rem,8.2vw,6.2rem);line-height:.85;letter-spacing:-.07em}
.mast h1 em{font-style:italic;font-weight:400;color:var(--ink);letter-spacing:-.06em}
.mast h1{white-space:nowrap}
.custom{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.lab{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);min-width:6.5em;text-align:right}
/* one 4-column grid: stuffing, cooking and goal cards share the same column widths */
.choices{display:grid;gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink)}
.seg,.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--rule);background:var(--ink)}
.seg button,.goal{min-height:clamp(62px,5.6vw,78px)}
.seg button{flex-direction:column;justify-content:center;gap:2px;padding:5px 4px 6px;border:0;font-size:clamp(.62rem,.25vw + .56rem,.72rem);letter-spacing:.05em;line-height:1.15;text-align:center}
.seg button svg{width:clamp(32px,3.2vw,44px);height:clamp(32px,3.2vw,44px);overflow:visible}
.seg button:hover{background:var(--blue-wash)}
.seg button[aria-checked="true"]{background:var(--yellow)}
#cookSeg button[aria-checked="true"]{background:var(--red);color:var(--white)}
#cookSeg button[aria-checked="true"] .sw{border-color:var(--white)}
@media (max-width:860px){.mast{grid-template-columns:1fr}.custom{align-items:stretch}.opt{justify-content:flex-start}.lab{text-align:left}}
@media (max-width:520px){.opt{flex-direction:column;align-items:stretch;gap:6px}.seg button{min-width:0;padding-inline:4px}}

/* poster grid */
.poster{display:grid;gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink);
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"info ill" "min ill" "void ill"}
.cell{background:var(--white);padding:clamp(16px,2.4vw,30px);min-width:0;display:flex;flex-direction:column;gap:12px}
.info{grid-area:info}.ill{grid-area:ill;align-items:center;justify-content:center;padding:clamp(12px,2vw,28px)}.min{grid-area:min;justify-content:center}.void{grid-area:void;padding:0;min-height:120px;background:var(--red);overflow:hidden}
@media (max-width:860px){
  .poster{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"info info" "ill ill" "min min" "void void"}
  .void{min-height:56px}
}
.eyebrow{font-family:var(--mono);font-size:clamp(.66rem,.4vw + .55rem,.78rem);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:var(--yellow);color:var(--ink);padding:2px 8px;font-weight:700;letter-spacing:.1em}
.chip.red{background:var(--red);color:var(--white)}
.chip.blue{background:var(--blue);color:var(--white)}

.bignum{font-family:var(--serif);font-weight:700;color:var(--red);font-size:clamp(4.5rem,11vw,8rem);line-height:.8;letter-spacing:-.04em;font-variant-numeric:lining-nums tabular-nums;margin:6px 0 2px}
.bignum small{font-size:.28em;color:var(--ink);font-weight:400;letter-spacing:0;margin-left:.2em;font-family:var(--mono)}
.info{justify-content:center}
.steps{border-top:var(--rule) dotted var(--ink-soft);padding-top:10px;display:flex;flex-direction:column;gap:2px;max-width:40ch}
.steps[hidden]{display:none}
.steps{gap:0!important}
.stepstage{margin-bottom:6px!important}
.stephint{margin-top:1px!important;line-height:1.3!important}
.steps p{margin:0;font-family:var(--sans);line-height:1.4}
.stepstage{font-family:var(--mono)!important;font-size:.7rem!important;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.steptitle{font-family:var(--mono)!important;font-weight:700;font-size:clamp(1.05rem,.5vw + .9rem,1.25rem);color:var(--ink);letter-spacing:-.01em;line-height:1.2!important}
.stephint{font-size:.88rem;color:var(--ink-soft)}
.showsteps{align-self:flex-start;min-height:38px;padding:0 14px;font-size:.72rem}
.showsteps svg{width:15px;height:15px}
.showsteps[aria-expanded="true"]{background:var(--ink);color:var(--white)}
.xinfo h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.35rem,1.6vw + .9rem,2.1rem);line-height:1.12;margin:0;text-wrap:balance}
.xinfo p.hint{margin:0;font-style:italic;color:var(--ink-soft);max-width:34ch}

/* timer circle */
.ring{width:100%;max-width:560px;height:auto;display:block}
.ring text{font-family:var(--mono)}
.stepno .n{font-family:var(--mono);font-weight:700;font-size:16px;fill:var(--red)}
.stepno .d{font-family:var(--mono);font-weight:700;font-size:16px;fill:var(--ink)}

/* minute cell */
.time{font-family:var(--mono);font-weight:500;font-size:clamp(3rem,7vw,5.2rem);letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums;color:var(--ink)}
.status{margin:0;font-family:var(--mono);font-size:clamp(.72rem,.4vw + .6rem,.85rem);color:var(--ink-soft)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-top:6px}
button{font-family:var(--mono);font-weight:700;font-size:clamp(.78rem,.4vw + .66rem,.9rem);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:var(--rule) solid var(--ink);background:var(--white);color:var(--ink);display:inline-flex;align-items:center;gap:10px;padding:0 18px;min-height:52px;transition:background .15s,color .15s,transform .1s}
button svg{width:18px;height:18px;flex:none}
button:active{transform:translateY(1px)}
button:focus-visible,.switch input:focus-visible + .track{outline:3px solid var(--yellow);outline-offset:3px}
.play{background:var(--red);border-color:var(--red);color:var(--white);flex:1 1 180px;justify-content:center}
.play:hover{background:var(--ink);border-color:var(--ink)}
.square{width:52px;padding:0;justify-content:center}
.square:hover,.ghost:hover{background:var(--blue-wash)}
.ghost{flex:1 1 160px;justify-content:center;background:var(--yellow);border-color:var(--yellow)}
.ghost:hover{background:var(--yellow-wash)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-family:var(--mono);font-size:clamp(.7rem,.35vw + .6rem,.8rem);color:var(--ink-soft);user-select:none;margin-top:4px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:40px;height:22px;border:var(--rule) solid var(--ink);position:relative;flex:none;background:var(--white);transition:background .15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;background:var(--ink);transition:transform .15s}
.switch input:checked + .track{background:var(--yellow)}
.switch input:checked + .track::after{transform:translateX(18px);background:var(--red)}
.switch input:disabled + .track{opacity:.4}
.switch b{color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* plate section */
.below{display:grid;gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink);grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.below{grid-template-columns:1fr}}
.count{font-family:var(--serif);font-weight:700;font-size:clamp(2.6rem,5vw,4rem);line-height:.9;color:var(--red);margin:0}
.count #momoWord{font-size:.4em;font-weight:400;font-style:italic;color:var(--ink);margin-left:.2em}
.plates{display:grid;grid-template-columns:1fr;gap:10px}
.plates.multi{grid-template-columns:repeat(2,minmax(0,1fr))}
.plates svg{width:100%;max-width:520px;height:auto;display:block;margin-inline:auto}
.weekart{width:100%;height:auto;display:block}
.stamps{display:flex;gap:clamp(4px,1vw,12px);flex-wrap:wrap;justify-content:center;padding-block:4px}
.sticker{border:0;background:none;padding:0;min-height:0;display:block;text-transform:none;letter-spacing:0;cursor:pointer;color:inherit;position:relative;width:clamp(96px,9vw,118px);aspect-ratio:140/132;flex:none;transform:rotate(-8deg);filter:drop-shadow(2px 3px 0 rgba(28,42,134,.22));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.sticker:nth-child(2){transform:rotate(6deg) translateY(6px)}.sticker:nth-child(3){transform:rotate(-3deg)}
.sticker:hover,.sticker[aria-expanded="true"]{transform:rotate(0) scale(1.08);background:none}
.sticker:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(28,42,134,.28);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.statpanel{border:var(--rule) solid var(--ink);padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:16px;background:var(--white);width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:8px 10px 0 rgba(28,42,134,.3);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.sp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sp-titles{display:flex;flex-direction:column;gap:2px}
.sp-head h3{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(1.4rem,2vw,1.7rem);line-height:1.05;color:var(--ink)}
.sp-head button{min-height:30px;width:30px;padding:0;justify-content:center;font-size:.9rem}
.sp-sub{margin:0;font-family:var(--sans);font-size:.86rem;line-height:1.3;color:var(--ink-soft)}
.sp-sub b{color:var(--red)}
.sp-chart{width:100%;height:auto;display:block}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink)}
.tile{background:var(--white);padding:12px 14px;display:flex;flex-direction:column;gap:3px;position:relative;min-height:112px}
.tile svg{position:absolute;right:8px;top:8px;width:46px;height:46px;overflow:visible}
.tile b{font-family:var(--serif);font-size:2.2rem;margin-top:auto;line-height:1;color:var(--red)}
.tile span{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tile em{font-style:normal;font-family:var(--sans);font-size:.8rem;color:var(--ink-soft)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:34px minmax(0,8.5rem) minmax(0,1fr) 2ch;gap:10px;align-items:center;font-family:var(--mono);font-size:.74rem}
.row svg{width:34px;height:30px;overflow:visible}
.row .bar{height:12px;background:var(--red);border-radius:0 4px 4px 0;min-width:4px}
.row .bw{background:var(--blue-wash);height:12px}
.row b{text-align:right}
.sticker svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sticker .txt{position:absolute;left:19%;right:19%;top:43%;bottom:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--white)}
.sticker b{font-family:var(--mono);font-weight:800;letter-spacing:-.03em;font-size:clamp(1rem,1.5vw,1.3rem);line-height:.95}
.sticker .txt span{font-family:var(--mono);font-weight:500;font-size:.44rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;margin-top:2px}
.sticker.yellow .txt{color:var(--ink)}
.sticker.yellow b{font-size:clamp(.72rem,.9vw,.84rem);line-height:1.05}
.xweek{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;border-bottom:var(--rule) solid var(--ink);padding-bottom:0}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bar{width:100%;background:var(--blue-wash);border:var(--rule) solid var(--blue);border-bottom:0;min-height:4px}
.day.today .bar{background:var(--red);border-color:var(--red)}
.day .n{font-family:var(--mono);font-size:.72rem;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-family:var(--mono);font-size:.7rem;text-align:center;color:var(--ink-soft);margin-top:6px}
.stat{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:clamp(.72rem,.35vw + .62rem,.84rem);border-top:var(--rule) dotted var(--ink-soft);padding-top:10px}
.stat b{color:var(--red)}
.note{margin:0;font-size:.85rem;font-style:italic;color:var(--ink-soft)}

.goalbar{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink)}
@media (max-width:760px){.goalbar{grid-template-columns:1fr}}
.goalhead{background:var(--white);padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;gap:8px;justify-content:center}
.goalhint{margin:0;font-style:italic;color:var(--ink-soft);font-size:.92rem;line-height:1.35}
.goal{flex-direction:column;justify-content:center;gap:2px;border:0;padding:5px 4px 6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-size:clamp(.66rem,.3vw + .58rem,.78rem)}
.goal svg{width:100%;max-width:84px;height:auto;pointer-events:none}
.goal small{font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--ink-soft);font-size:.9em}
.goal{position:relative}
.goal::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);background:var(--red);color:var(--white);font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.goal:hover::after,.goal:focus-visible::after{opacity:1;transform:translate(-50%,-50%)}
.goal.dragging::after{display:none}
.goal:hover{background:var(--blue-wash)}
.goal[aria-pressed="true"]{background:var(--yellow)}
.goal.dragging{position:fixed;z-index:50;pointer-events:none;background:var(--white);border:var(--rule) solid var(--ink);box-shadow:4px 6px 0 rgba(28,42,134,.25);transform:rotate(-4deg);cursor:grabbing}
body.goal-dragging{cursor:grabbing;user-select:none}
.dropbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--yellow);color:var(--ink);font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;text-align:center;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:var(--rule) solid var(--ink);transform:translateY(100%);visibility:hidden;transition:transform .2s,visibility 0s .2s}
body.goal-dragging .dropbar{transform:none;visibility:visible;transition:transform .2s}
.dropbar.over,.platecell.over{background:var(--red);color:var(--white)}
.platecell.over{outline:4px dashed var(--yellow);outline-offset:-10px;background:var(--white)}
.platehead{display:flex;flex-direction:column;gap:6px}
.goalline{margin:0;font-family:var(--mono);font-size:clamp(.72rem,.35vw + .62rem,.84rem);color:var(--ink-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goalline b{color:var(--ink)}
.goalline .done{background:var(--red);color:var(--white);padding:2px 8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.goalline button{min-height:28px;padding:0 10px;font-size:.66rem}
.confirm{border:var(--rule) solid var(--ink);background:var(--yellow-wash);padding:14px;display:flex;flex-direction:column;gap:12px}
.confirm p{margin:0;font-size:1rem}
.confirm b{color:var(--red)}
.cbtns{display:flex;gap:10px;flex-wrap:wrap}
.cbtns button{flex:1 1 150px;justify-content:center}
.tabs{display:flex;gap:0;border:var(--rule) solid var(--ink);align-self:flex-start}
.tabs button{min-height:40px;padding:0 16px;border:0;font-size:.72rem;gap:8px}
.tabs button+button{border-left:var(--rule) solid var(--ink)}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--white)}
.view{display:flex;flex-direction:column;gap:clamp(16px,2.5vw,28px)}
.view[hidden]{display:none!important}
.settings{display:grid!important;gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink)}
.settings[hidden]{display:none!important}
.setrow{background:var(--white);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:16px;padding:clamp(14px,2vw,20px) clamp(16px,2.4vw,28px)}
@media (max-width:640px){.setrow{grid-template-columns:1fr}}
.setlab{display:flex;flex-direction:column;gap:2px}
.setlab b{font-family:var(--mono);font-weight:700;letter-spacing:-.01em;font-size:clamp(.98rem,.4vw + .85rem,1.1rem);color:var(--ink)}
.setlab small{font-family:var(--mono);font-size:.7rem;letter-spacing:.03em;color:var(--ink-soft)}
.schemes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink)}
.schemes button{border:0;flex-direction:column;gap:0;min-height:38px;padding:3px 4px;font-size:.66rem;line-height:1.2}
.schemes button small{font-weight:400;letter-spacing:.02em;text-transform:none;font-size:.92em;color:var(--ink-soft)}
.schemes button[aria-checked="true"]{background:var(--yellow)}
.schemes button[data-k="custom"][aria-checked="true"]{background:var(--red);color:var(--white)}
.schemes button[data-k="custom"][aria-checked="true"] small{color:var(--white)}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) auto 52px;align-items:center;border:var(--rule) solid var(--ink);justify-self:stretch;max-width:340px;width:100%}
.stepper button{border:0;min-height:48px;padding:0;justify-content:center;font-size:1.2rem}
.stepper button:first-child{border-right:var(--rule) solid var(--ink)}
.stepper button:last-child{border-left:var(--rule) solid var(--ink)}
.stepper input{border:0;background:transparent;font-family:var(--mono);font-weight:700;font-size:1.3rem;color:var(--red);text-align:right;width:100%;min-width:0;padding:0 6px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}
.stepper .unit{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);padding-right:10px}
.settings .switch{margin:0;justify-self:start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--white);padding:12px 20px;font-family:var(--mono);font-size:.85rem;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* illustration inks (drawing lives on white paper) */
.paper{--paper:#ffffff;--pencil:#2b44c4;--steel:#f3f5fd;--steel-dark:#c7d0f1;--dough:#fff5dc;--dough-shade:#dcc38c;--bamboo:#eab52b;--bamboo-soft:#fbeab3;--leaf:#2f8a4a;--chilli:#e3402b;--muted:#8a94c4}
.steam path{animation:rise 2.4s ease-in-out infinite;opacity:0}
.steam path:nth-child(2n){animation-delay:.8s}
.steam path:nth-child(3n){animation-delay:1.6s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.steam path,.pop{animation:none;opacity:.7}}
</style>
</head>

<script>
const FILLINGS={
 veg:{name:"Veg",sw:"#8fc46a",base:"#cfe6ae",layers:["cab","car","gar","oni"],s10:"drops",steps:[
  ["Chop the cabbage fine","Tiny pieces, so nothing tears the wrapper."],["Grate the carrot","Bright orange on the green."],
  ["Mince garlic and ginger","The smell that tells everyone momos are coming."],["Slice the spring onions","Greens and whites both."],
  ["Squeeze the water out","Wet filling makes soggy momos."],["Season it","Soy sauce, salt, black pepper."],["Mix the filling","Toss until every bit is coated."]]},
 paneer:{name:"Paneer",sw:"#fffaf0",base:"#f5eedb",layers:["pan","onw","gar","chl"],s10:"cor",steps:[
  ["Crumble the paneer","Soft and fresh, broken up with your fingers."],["Chop the onion fine","Small enough to melt into the paneer."],
  ["Mince garlic and ginger","A little heat, a lot of smell."],["Slit the green chillies","Seeds out if you want it gentle."],
  ["Chop the coriander","A handful, stems and all."],["Season it","Salt, pepper, a pinch of garam masala."],["Mix the filling","Toss until every bit is coated."]]},
 chicken:{name:"Chicken",sw:"#e9b8a4",base:"#f2d3c6",layers:["chk","onw","gar","oni"],s10:"drops",steps:[
  ["Mince the chicken","Thigh meat keeps it juicy."],["Chop the onion fine","Small pieces, lots of them."],
  ["Mince garlic and ginger","The smell that tells everyone momos are coming."],["Slice the spring onions","Greens and whites both."],
  ["Add a splash of water","It steams inside and keeps the filling soft."],["Season it","Soy sauce, salt, black pepper."],["Mix the filling","Work it until it turns sticky."]]},
 corn:{name:"Corn cheese",sw:"#f4c534",base:"#fbe9a8",layers:["crn","chs","cap","gar"],s10:"oni",steps:[
  ["Boil the corn","Sweet kernels, drained well."],["Grate the cheese","Mozzarella, so it pulls."],
  ["Chop the capsicum","Green and red, small squares."],["Mince the garlic","Just a little."],
  ["Chop the spring onions","For a bit of green."],["Season it","Salt, chilli flakes, oregano."],["Mix the filling","Toss until every bit is coated."]]}
};
const COOKS={
 steamed:{name:"Steamed",stage:"Steam",sw:"#fff5dc",steps:[["Oil the steamer basket","A thin coat so it lifts off cleanly."],["Bring the water to a boil","Rolling boil under the basket."],["Place the momo in the steamer","Give it space to puff up."],["Lid on and steam","Ten minutes in real life. One minute here."],["Plate it with red chutney","Done. One momo, earned."]]},
 fried:{name:"Fried",stage:"Fry",sw:"#efc26a",steps:[["Pour oil into the kadhai","Enough for the momo to float."],["Heat it till it shimmers","A pinch of dough should sizzle."],["Slide the momo in gently","Away from you, no splashes."],["Fry till golden","Turn it once. Crisp all over."],["Plate it with red chutney","Done. One crunchy momo, earned."]]},
 tandoori:{name:"Tandoori",stage:"Roast",sw:"#ec7a45",steps:[["Whisk curd and tandoori masala","Thick and red, with a squeeze of lemon."],["Coat the momo","Every pleat, all the way round."],["Thread it onto a skewer","Leave a little gap between each."],["Roast till charred","Blistered spots are the good part."],["Plate it with mint chutney","Done. One smoky momo, earned."]]},
 pansear:{name:"Pan seared",stage:"Sear",sw:"#d9a45a",steps:[["Heat a little oil in a pan","Just enough to coat the base."],["Set the momo flat side down","Let it sizzle without moving it."],["Splash in water and cover","The steam cooks the top."],["Uncover and crisp the base","Golden underneath, soft on top."],["Plate it with red chutney","Done. One crackly-bottomed momo, earned."]]}
};
const MIDDLE=[
 ["Wrapper","Roll the dough into a log","Even thickness, end to end."],["Wrapper","Cut it into small pieces","Each one the size of a marble."],
 ["Wrapper","Flatten a piece with your palm","Dust with flour so it doesn't stick."],["Wrapper","Roll out a thin wrapper","Thin edges, slightly thicker centre."],
 ["Wrapper","Spoon filling into the centre","Not too much. Leave room to pleat."],["Pleat","Make the first pleat","Pinch the edge and fold it over."],
 ["Pleat","Keep pleating around the edge","Pleat, pinch, turn. Pleat, pinch, turn."],["Pleat","Twist and seal the top","A little knot so nothing escapes."]];
const DOUGH=[["Dough","Sift the maida into a bowl","Two cups of all-purpose flour, heaped high."],["Dough","Add a pinch of salt","Just enough to wake the flour up."],
 ["Dough","Pour in water, little by little","Make a well. Cold water, a splash at a time."],["Dough","Knead until smooth","Push, fold, turn. Keep going."],["Dough","Cover and let it rest","A damp cloth on top. The gluten relaxes."]];
let C=null;
function getSteps(){const F=FILLINGS[C.fill],K=COOKS[C.cook];
  return [...DOUGH,...F.steps.map(x=>["Filling",...x]),...MIDDLE,...K.steps.slice(0,4).map(x=>[K.stage,...x]),["Serve",...K.steps[4]]]}
const stagesNow=()=>["Dough","Filling","Wrapper","Pleat",COOKS[C.cook].stage,"Serve"];
const $=id=>document.getElementById(id);
const MIN=60000, TOTAL=25, BREAK=5;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const SCHEMES={classic:{name:"Classic",v:[25,5,15,4]},personal:{name:"Personal",v:[30,2,25,4]},work:{name:"Work",v:[50,10,20,2]}};
const LIMITS={focus:[5,90],short:[1,30],long:[5,60],every:[2,8]};
let SET=Object.assign({focus:25,short:5,long:15,every:4,autoMomo:false,autoBreak:false,sound:true,scheme:"classic"},store.get("momodoro:settings",{}));
let minsLog=store.get("momodoro:mins",{});

}

function miniPlate(n){let m="";for(let i=0;i<n;i++){const a=i*2.39996,r=i===0?0:10.5*Math.sqrt(i);m+=momo(60+Math.cos(a)*r,44+Math.sin(a)*r*.6,.22,5,"",C.cook)}
  return `<svg class="paper" viewBox="0 0 120 80" aria-hidden="true"><ellipse data-raw cx="60" cy="42" rx="53" ry="31" fill="#fff"/><ellipse cx="60" cy="42" rx="54" ry="32" fill="var(--steel)" stroke="var(--pencil)" stroke-width="1.8"/><ellipse cx="60" cy="42" rx="42" ry="24" fill="none" stroke="var(--pencil)" stroke-width="1" opacity=".7"/><g transform="translate(0,-4)">${m}</g></svg>`}
function setGoal(n){goals[dayKey()]=n;store.set("momodoro:goals",goals);renderGoals();renderPlate();toast(`Goal set: ${GOALS.find(g=>g.n===n).label.toLowerCase()}`)}
function renderGoals(){const cur=goals[dayKey()]||0;
  $("goals").innerHTML=GOALS.map(g=>`<button type="button" class="goal" data-n="${g.n}" aria-pressed="${cur===g.n}" aria-label="Goal: ${g.label}, ${g.n} momos" data-label="${g.label}">${miniPlate(g.n)}</button>`).join("");
  $("goals").querySelectorAll("svg").forEach(v=>sketchify(v));
  $("goals").querySelectorAll(".goal").forEach(initDrag);}
function overDrop(x,y){for(const el of [$("dropBar"),$("plateDrop")]){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&r.height>0)return el}return null}
function initDrag(btn){
  let sx=0,sy=0,ghost=null,moved=false,pid=null,scrollTimer=null,lastY=0;
  const cleanup=()=>{if(ghost)ghost.remove();ghost=null;document.body.classList.remove("goal-dragging");$("dropBar").classList.remove("over");$("plateDrop").classList.remove("over");clearInterval(scrollTimer);scrollTimer=null};
  btn.addEventListener("pointerdown",e=>{if(e.button>0)return;sx=e.clientX;sy=e.clientY;moved=false;pid=e.pointerId;try{btn.setPointerCapture(pid)}catch(_){} });
  btn.addEventListener("pointermove",e=>{if(e.pointerId!==pid)return;
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){moved=true;ghost=btn.cloneNode(true);ghost.classList.add("dragging");ghost.style.width=btn.offsetWidth+"px";document.body.appendChild(ghost);document.body.classList.add("goal-dragging");
      scrollTimer=setInterval(()=>{if(lastY>innerHeight-110)scrollBy(0,14);else if(lastY<60)scrollBy(0,-14)},16)}
    if(ghost){lastY=e.clientY;ghost.style.left=(e.clientX-btn.offsetWidth/2)+"px";ghost.style.top=(e.clientY-btn.offsetHeight*.6)+"px";const t=overDrop(e.clientX,e.clientY);$("dropBar").classList.toggle("over",t===$("dropBar"));$("plateDrop").classList.toggle("over",t===$("plateDrop"))}});
  btn.addEventListener("pointerup",e=>{if(e.pointerId!==pid)return;pid=null;const hit=ghost&&overDrop(e.clientX,e.clientY);const wasDrag=!!ghost;cleanup();
    if(wasDrag){if(hit){setGoal(+btn.dataset.n);$("plateDrop").scrollIntoView({behavior:"smooth",block:"center"})}}else if(!moved)setGoal(+btn.dataset.n)});
  btn.addEventListener("pointercancel",()=>{pid=null;cleanup()});
  btn.addEventListener("click",e=>{if(e.detail===0)setGoal(+btn.dataset.n)});
}

let openStat=null;
function streak(){let n=0;const d=new Date();if(!dayList(dayKey(d)).length)d.setDate(d.getDate()-1);while(dayList(dayKey(d)).length){n++;d.setDate(d.getDate()-1)}return n}
function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push([d,dayList(dayKey(d))])}return a}
const dname=d=>d.toLocaleDateString("en-GB",{weekday:"short"});
const hm=m=>m>=60?`${Math.floor(m/60)} h ${m%60?m%60+" min":""}`.trim():`${m} min`;
function statHTML(kind){
  const arr=last7();
  if(kind==="mins"){
    const v=arr.map(a=>minsFor(dayKey(a[0]))),tot=v.reduce((a,b)=>a+b,0),max=Math.max(100,...v);
    let g=`<path d="M6,122 H314" stroke="var(--pencil)" stroke-width="1.4" fill="none"/>`;
    [max/2,max].forEach(t=>{const y=122-t/max*96;g+=`<path d="M6,${y} H314" stroke="#c9d2f5" stroke-width="1" stroke-dasharray="2 4" fill="none" data-raw/><text x="8" y="${y-3}" font-family="JetBrains Mono,monospace" font-size="8" fill="#5563a8">${Math.round(t)} min</text>`});
    arr.forEach(([d],i)=>{const cx=38+i*42,h=v[i]/max*96,today=i===6;
      if(v[i])g+=`<path d="M${cx-12},122 V${122-h+4} q0,-4 4,-4 h16 q4,0 4,4 V122Z" fill="${today?"var(--chilli)":"#f08a78"}"><title>${dname(d)}: ${v[i]} min</title></path><text x="${cx}" y="${118-h}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="#1c2a86">${v[i]}</text>`;
      g+=`<text x="${cx}" y="138" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="${today?"#e3402b":"#5563a8"}" font-weight="${today?700:400}">${today?"TODAY":dname(d).toUpperCase()}</text>`});
    return `<div class="sp-head"><div class="sp-titles"><h3 id="spTitle">Focus this week</h3><p class="sp-sub"><b>${hm(tot)}</b> in the last 7 days · about ${Math.round(tot/7)} min a day</p></div><button type="button" class="sp-x" aria-label="Close">×</button></div>
      <svg class="sp-chart paper" viewBox="0 0 320 146" role="img" aria-label="Minutes focused each day">${g}</svg>`;
  }
  if(kind==="momos"){
    const all=Object.keys(days).reduce((a,k)=>a+dayList(k).length,0),wk=arr.reduce((a,b)=>a+b[1].length,0);
    const best=Object.keys(days).map(k=>[k,dayList(k).length]).sort((a,b)=>b[1]-a[1])[0];
    const bestTxt=best&&best[1]?new Date(best[0]+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"not yet";
    const hits=arr.filter(([d,l])=>goals[dayKey(d)]&&l.length>=goals[dayKey(d)]).length;
    return `<div class="sp-head"><div class="sp-titles"><h3 id="spTitle">Your momo count</h3></div><button type="button" class="sp-x" aria-label="Close">×</button></div>
      <div class="tiles"><div class="tile">${TILEICON.cab}<span>All time</span><b>${all}</b><em>${hm(Object.keys(days).reduce((a,k)=>a+minsFor(k),0))} focused</em></div>
      <div class="tile">${TILEICON.car}<span>This week</span><b>${wk}</b><em>${wk?Math.round(wk/7*10)/10+" a day":"none yet"}</em></div>
      <div class="tile">${TILEICON.crn}<span>Best day</span><b>${best?best[1]:0}</b><em>${bestTxt}</em></div>
      <div class="tile">${TILEICON.chl}<span>Streak</span><b>${streak()}</b><em>days in a row · ${hits} goal${hits===1?"":"s"} hit</em></div></div>`;
  }
  const tally={};arr.flatMap(a=>a[1]).forEach(t=>tally[t]=(tally[t]||0)+1);
  const rows=Object.entries(tally).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1;
  return `<div class="sp-head"><div class="sp-titles"><h3 id="spTitle">Flavours this week</h3></div><button type="button" class="sp-x" aria-label="Close">×</button></div>
    ${rows.length?`<div class="rows">${rows.map(([t,n])=>{const [f,c]=t.split(":");return `<div class="row" title="${n} ${FILLINGS[f]?.name} ${COOKS[c]?.name.toLowerCase()}"><svg class="paper" viewBox="-40 -34 80 60" aria-hidden="true">${momo(0,0,1,7,"",c,f)}</svg><span>${FILLINGS[f]?.name||f} ${(COOKS[c]?.name||c).toLowerCase()}</span><div class="bw"><div class="bar" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`}).join("")}</div>`:`<p class="sp-sub">No momos this week yet.</p>`}`;
}
function renderStat(){
  document.querySelectorAll(".sticker").forEach(b=>b.setAttribute("aria-expanded",b.dataset.stat===openStat));
  const el=$("statPanel");$("statModal").hidden=!openStat;if(!openStat)return;

  const cur=[SET.focus,SET.short,SET.long,SET.every];

  $("schemes").querySelectorAll("button").forEach(b=>b.onclick=()=>{const sc=SCHEMES[b.dataset.k];if(!sc)return;[SET.focus,SET.short,SET.long,SET.every]=sc.v;SET.scheme=b.dataset.k;saveSet()});
